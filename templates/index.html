<!DOCTYPE html>
<html>
<head>
    <title>Text to Video</title>
</head>
<body>
    <h1>🎬 Text-to-Video Generator</h1>
    <form method="POST">
        <label>Enter your prompt:</label><br>
        <input type="text" name="prompt" size="60" value="A father telling his son about life struggles"><br><br>

        <label>Number of frames:</label>
        <input type="number" name="frames" value="6" min="3" max="12"><br><br>

        <label>Frames per second:</label>
        <input type="number" name="fps" value="2" min="1" max="5"><br><br>

        <button type="submit">Generate Video</button>
    </form>

    {% if video_path %}
        <h2>Generated Video:</h2>
        <video width="480" controls>
            <source src="{{ video_path }}" type="video/mp4">
        </video>
        <br>
        <a href="/download/{{ video_path }}">📥 Download Video</a>
    {% endif %}
</body>
</html>
